name: Caçar promoções Livelo

on:
  schedule:
    # a cada 3 horas (promoções de transferência às vezes duram só 1 dia)
    - cron: "41 */3 * * *"
  workflow_dispatch: {}
  push:
    paths: ["scripts/promos.py", ".github/workflows/promos.yml"]

permissions:
  contents: write

concurrency:
  group: promos
  cancel-in-progress: false

jobs:
  promos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler blogs de milhas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/promos.py
      - name: Salvar
        run: |
          git config user.name "robo-milhas"
          git config user.email "robo-milhas@users.noreply.github.com"
          git add data/promos_livelo.json
          git diff --cached --quiet || git commit -m "Atualiza promoções Livelo"
          git pull --rebase
          git push
