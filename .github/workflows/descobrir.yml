name: Teste da busca gratuita

on:
  push:
    paths: ["scripts/descobrir.py", "scripts/mcp.py", ".github/workflows/descobrir.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/descobrir.py
      - run: |
          git config user.name "robo-milhas"
          git config user.email "robo-milhas@users.noreply.github.com"
          git add data/_descoberta.json
          git diff --cached --quiet || git commit -m "Resultado do teste da busca gratuita"
          git pull --rebase && git push
